services:
  app:
    build: .
    container_name: youtube-mp3-downloader
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      # Área de trabalho dos downloads (descartável)
      - downloads:/data
      # Para usar um cookies.txt local, descomente e defina COOKIES_PATH=/run/secrets/cookies.txt
      # - ./cookies.txt:/run/secrets/cookies.txt:ro
    restart: unless-stopped

volumes:
  downloads:
